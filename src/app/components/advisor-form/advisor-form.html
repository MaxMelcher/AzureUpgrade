<section class="advisor-card" aria-labelledby="advisor-title">
  <div class="card-heading">
    <div>
      <p class="step">01 / Inventory</p>
      <h2 id="advisor-title">Describe the current VMs</h2>
    </div>
  </div>

  <form (ngSubmit)="submit()">
    <div class="control-grid">
      <label>
        <span>Azure region</span>
        <input
          class="region-search"
          type="search"
          name="regionSearch"
          autocomplete="off"
          placeholder="Search by name or region code"
          aria-label="Search Azure regions"
          [ngModel]="regionSearch()"
          (ngModelChange)="regionSearch.set($event)"
        />
        <select name="region" [ngModel]="region" (ngModelChange)="selectRegion($event)" required>
          <option value="" disabled>Select a region</option>
          @for (item of filteredRegions(); track item.name) {
            <option [value]="item.name">{{ item.displayName }} ({{ item.skuCount }} SKUs)</option>
          }
          @if (filteredRegions().length === 0) {
            <option value="" disabled>No matching regions</option>
          }
        </select>
        <small class="control-note">
          {{ filteredRegions().length }} of {{ regions().length }} regions shown
        </small>
      </label>

      <label>
        <span>Operating system</span>
        <select name="os" [(ngModel)]="os">
          <option value="linux">Linux</option>
          <option value="windows">Windows</option>
        </select>
        <small class="control-note">
          Linux can resize between sizes with and without a local temp disk. Windows must keep the
          same temp-disk presence.
          <a
            href="https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm?tabs=portal#limitations"
            target="_blank"
            rel="noopener noreferrer"
            >Resize limitations</a
          >
        </small>
      </label>

      <label>
        <span>Currency</span>
        <select name="currency" [(ngModel)]="currency">
          <option value="USD">US dollar (USD)</option>
          <option value="EUR">Euro (EUR)</option>
          <option value="GBP">Pound sterling (GBP)</option>
        </select>
      </label>
    </div>

    <label class="eol-toggle temp-disk-toggle">
      <input type="checkbox" name="keepCpuVendor" [(ngModel)]="keepCpuVendor" />
      <span>
        Keep Intel/AMD
        <small>
          On by default. Turn off to consider same-architecture Intel↔AMD migrations. Cross-vendor
          migrations potentially require further workload, performance, and licensing testing.
        </small>
      </span>
    </label>

    @if (os === 'linux') {
      <label class="eol-toggle temp-disk-toggle">
        <input type="checkbox" name="keepTempDisk" [(ngModel)]="keepTempDisk" />
        <span>
          Keep temp disk
          <small>
            On by default. Turn off to consider Linux sizes without local temporary storage. Move
            required data and reconfigure swap or temporary workloads before resizing.
          </small>
        </span>
      </label>
    }

    <label class="sku-input">
      <span>Current VM sizes</span>
      <small>One per line, comma-separated, or paste an Excel column.</small>
      <textarea name="skus" [(ngModel)]="skuInput" rows="7" spellcheck="false"></textarea>
    </label>

    @if (validationError()) {
      <p class="validation" role="alert">{{ validationError() }}</p>
    }

    <button class="primary-button" type="submit" [disabled]="busy()">
      @if (busy()) {
        <span class="spinner" aria-hidden="true"></span> Analyzing catalog...
      } @else {
        Find upgrades <span aria-hidden="true">→</span>
      }
    </button>
  </form>
</section>
