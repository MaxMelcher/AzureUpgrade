name: Deploy Azure Static Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-static-web-app
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy production
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_STONE_06A515C10 }}
        run: |
          npx --yes @azure/static-web-apps-cli@2.0.10 deploy \
            ./dist/azure-vm-upgrade-advisor/browser \
            --deployment-token "$SWA_CLI_DEPLOYMENT_TOKEN" \
            --env production
